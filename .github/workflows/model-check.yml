name: Contrôle des modèles IA

# Groq retire régulièrement des modèles. Ce contrôle hebdomadaire échoue (et GitHub vous écrit)
# si un modèle configuré n'existe plus, avant que les utilisateurs ne le découvrent.
# Secret requis : GROQ_API_KEY (Settings > Secrets and variables > Actions).
# Si vous surchargez les modèles sur Vercel (GROQ_MODEL_*), ajoutez-les aussi en variables du dépôt.

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/check-models.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL_QUIZ: ${{ vars.GROQ_MODEL_QUIZ }}
          GROQ_MODEL_SUMMARY: ${{ vars.GROQ_MODEL_SUMMARY }}
          GROQ_MODEL_THEMES: ${{ vars.GROQ_MODEL_THEMES }}
