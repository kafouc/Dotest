<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne - Sheet of Paper</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; background: #f9fafb; color: #0f172a; display: grid; place-items: center; min-height: 100vh; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; max-width: 520px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 16px; color: #475569; }
    .hint { font-size: 14px; color: #64748b; }
    .row { display: flex; gap: 12px; align-items: center; }
    .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #e5e7eb; background: #fff; color: #0f172a; padding: 8px 12px; border-radius: 999px; text-decoration: none; }
    .btn:hover { background: #f8fafc; }
    .ico { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="row">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12h18M3 6h18M3 18h18"/></svg>
      <h1>Vous êtes hors ligne</h1>

    <p>Impossible de charger la page. Vérifiez votre connexion internet et réessayez.</p>

</html>
